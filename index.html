 box(1.2,1,1.6,col,0,1.3,0,body);box(.9,.9,.9,col,0,2.2,-.7,body);box(.25,.35,.7,comb,0,2.85,-.7,body);box(.25,.2,.3,comb,0,2.7,-.2,body);
 box(.3,.2,.4,0xffa000,0,2.15,-1.3,body);box(.2,.3,.1,0xe03131,0,1.9,-1.2,body);
 box(.15,.15,.05,0x000000,.3,2.35,-1.17,body);box(.15,.15,.05,0x000000,-.3,2.35,-1.17,body);
 box(.25,.7,.8,wc,.7,1.3,0,body);box(.25,.7,.8,wc,-.7,1.3,0,body);box(.9,.9,.3,wc,0,1.6,.9,body);
 const legs=[-.3,.3].map(l=>box(.15,.9,.15,0xffd43b,l,.45,.1,ck));
 box(.5,.1,.5,0xffd43b,-.3,.05,-.1,ck);box(.5,.1,.5,0xffd43b,.3,.05,-.1,ck);
 const stars=new THREE.Group();for(let i=0;i<5;i++){const m=box(.28,.28,.28,0xffd43b,Math.cos(i*1.256)*.9,0,Math.sin(i*1.256)*.9,stars);m.rotation.set(.7,.7,0)}
 stars.position.y=3.5;stars.visible=false;ck.add(stars);
 return {ck,body,legs,stars}}

function size(){const w=fr.clientWidth,h=fr.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
new ResizeObserver(size).observe(fr);size();

/* ===== STATE & MULTIPLAYER (serentak: tiap pemain punya layar & soal sendiri) ===== */
const SKIN=[["putih",0xffffff,"#ced4da"],["oranye",0xff922b,"#ff922b"],["biru",0x74c0fc,"#339af0"],["pink",0xf783ac,"#f06595"]];
let P=[],paused=false,done=false,t0=0;
const step=(Z0-FIN)/N;
const prog=document.getElementById("prog");
const bar=p=>PLAN.map((_,i)=>`<i class="${i<p.idx?"ok":""}">${i<p.idx?"✔":i+1}</i>`).join("");
function updBar(p){if(P.length>1)p.cell.querySelector(".pbar").innerHTML=bar(p);else prog.innerHTML="<span>SOAL</span>"+PLAN.map((_,i)=>`<i class="${i<p.idx?"ok":i==p.idx?"cur":""}">${i<p.idx?"✔":i+1}</i>`).join("")}
function menu(){mb.innerHTML=`<h2>🐔 BALAP AYAM</h2><p>Pilih jumlah pemain</p><div class="pl">${[1,2,3,4].map(n=>`<button data-n="${n}">${n} 🐔</button>`).join("")}</div><p style="font-size:12px;opacity:.7;margin:12px 0 0">1 pemain = Latihan<br>2–4 pemain = balapan serentak<br>(tiap pemain punya layar dan soal sendiri)</p><p class="hint">📱 Untuk 3–4 pemain, putar HP ke mode lanskap</p>`;
 modal.style.display="flex";mb.querySelectorAll("button").forEach(b=>b.onclick=()=>start(+b.dataset.n))}
function buildCells(){cells.innerHTML="";cells.className="on n"+P.length;
 P.forEach(p=>{const c=document.createElement("div");c.className="cell";c.style.setProperty("--c",p.css);
  c.innerHTML=`<div class="pc"><div class="ph"><b></b><span>${p.name} • ${p.cn}</span><em class="pn"></em><u class="pd"></u></div><div class="pbar"></div><div class="pq"></div><div class="pa"></div></div>`;
  cells.appendChild(c);p.cell=c})}
function ansBtns(p,q,box){box.innerHTML="";q.o.forEach((t,i)=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>pick(p,i,b);box.appendChild(b)})}
function fillCell(p){const c=p.cell,q=p.qs[p.idx];
 c.querySelector(".pn").textContent=`Soal ${p.idx+1} / ${N}`;c.querySelector(".pd").textContent=q.d;
 c.querySelector(".pbar").innerHTML=bar(p);c.querySelector(".pq").textContent=q.q;ansBtns(p,q,c.querySelector(".pa"))}
function draw(p){const q=p.qs[p.idx];
 if(P.length===1){updBar(p);qn.textContent=`Soal ${p.idx+1} / ${N}`;qd.textContent=q.d;qt.textContent=q.q;
  document.getElementById("left").textContent=`${N-p.idx} soal lagi`;tg.textContent=`${p.name} • ${p.cn}`;ansBtns(p,q,ans)}
 else fillCell(p)}
function start(n){const D=deal(n);
 for(let i=0;i<n;i++){const k=SKIN[i],c=makeChicken(k[1],0xe03131);
  c.ck.position.set(n>1?(i-(n-1)/2)*1.9:0,0,Z0);if(n>1)c.ck.scale.setScalar(.72);S.add(c.ck);
  P.push({...c,name:"Pemain "+(i+1),cn:k[0],css:k[2],qs:D[i],idx:0,tz:Z0,dz:0,win:false,busy:false,camZ:Z0})}
 md.textContent=n>1?`BALAPAN ${n} PEMAIN • SERENTAK`:"LATIHAN";
 modal.style.display="none";t0=performance.now();startBGM();sfx.click();
 if(n===1){card.style.display="block";draw(P[0]);return}
 fr.classList.add("multi");buildCells();cells.classList.add("lock");P.forEach(p=>{p.busy=true;fillCell(p)});
 ["3","2","1","MULAI!"].forEach((x,i)=>setTimeout(()=>{tn.textContent=x;tn.classList.remove("go");void tn.offsetWidth;tn.classList.add("go");
  tone(x==="MULAI!"?880:440,0,.2,"square",.08);
  if(i===3){cells.classList.remove("lock");P.forEach(p=>p.busy=false);t0=performance.now()}},i*900))}
function pick(p,i,b){if(p.busy||paused||done)return;sfx.click();
 if(i===p.qs[p.idx].a){p.busy=true;b.classList.add("good");sfx.ok();setTimeout(sfx.cluck,300);setTimeout(sfx.hop,450);
  p.idx++;p.tz=Z0-step*p.idx;updBar(p);
  setTimeout(()=>{if(done)return;if(p.idx>=N)finish(p);else{p.busy=false;draw(p)}},1100);
 }else{b.classList.add("bad");sfx.bad();sfx.boing();p.dz=1.5;p.stars.visible=true;p.busy=true;
  setTimeout(()=>{b.classList.remove("bad");p.busy=false},1500)}}
function finish(p){done=true;p.win=true;p.tz=FIN-6;card.style.display="none";cells.style.pointerEvents="none";const el=Math.round((performance.now()-t0)/1000);
 const rank=[...P].sort((a,b)=>b.idx-a.idx);
 setTimeout(()=>{sfx.win();
  mb.innerHTML=P.length>1?`<h2>🏆 ${p.name} menang! 🏆</h2><p>Ayam ${p.cn} mencapai garis FINISH pertama!</p><p style="text-align:left">${rank.map((q,i)=>`${i+1}. ${q.name} (${q.cn}) — ${q.idx}/${N} soal`).join("<br>")}</p><p>Waktu: ${el} detik</p><button onclick="location.reload()">Main Lagi</button>`
  :`<h2>🎉 Selamat! 🎉</h2><p>Ayammu mencapai garis FINISH!</p><p><b>Skor: ${N} / ${N}</b> • Waktu: ${el} detik</p><button onclick="location.reload()">Main Lagi</button>`;
  modal.style.display="flex"},1600)}
bA.onclick=()=>{mute=!mute;bA.textContent=mute?"🔇":"🔊"};
const de=document.documentElement;
if(!(de.requestFullscreen||de.webkitRequestFullscreen))bF.style.display="none";/* iPhone tidak mendukung layar penuh: tombol disembunyikan */
bF.onclick=()=>{const on=document.fullscreenElement||document.webkitFullscreenElement;
 if(on){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{(de.requestFullscreen||de.webkitRequestFullscreen).call(de)}};
bP.onclick=()=>{if(!P.length||done)return;paused=!paused;bP.textContent=paused?"▶":"⏸";if(paused){mb.innerHTML="<h2>Jeda</h2><button id='rs'>Lanjut</button>";modal.style.display="flex";rs.onclick=bP.onclick}else modal.style.display="none"};

/* ===== LOOP (satu layar terbagi: tiap pemain punya kamera sendiri) ===== */
const clk=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05),t=clk.elapsedTime;
 if(!paused){let mv=false;
  P.forEach(p=>{const ck=p.ck,dz=p.tz-ck.position.z;
   if(Math.abs(dz)>.05){mv=true;ck.position.z+=Math.sign(dz)*Math.min(Math.abs(dz),(p.win?9:7)*dt);ck.position.y=Math.abs(Math.sin(t*10))*.7;
    p.legs.forEach((l,i)=>l.rotation.x=Math.sin(t*14+i*3)*.5)}
   else{ck.position.y=p.win?Math.abs(Math.sin(t*6))*1.4:0;p.legs.forEach(l=>l.rotation.x=0)}
   if(p.dz>0){p.dz-=dt;p.body.rotation.z=Math.sin(t*14)*.35;p.body.rotation.y=Math.sin(t*9)*.5;p.stars.rotation.y+=dt*8;
    if(p.dz<=0){p.dz=0;p.stars.visible=false;p.body.rotation.set(0,0,0)}}
   p.camZ+=(ck.position.z-p.camZ)*Math.min(1,dt*3)});
  if(mv){stepT-=dt;if(stepT<=0){tone(140,0,.05,"square",.04);stepT=.22}}}
 const fw=fr.clientWidth,fh=fr.clientHeight,fb=fr.getBoundingClientRect();
 cells.classList.toggle("port",fw<fh);
 R.setScissorTest(true);
 for(let i=0;i<Math.max(P.length,1);i++){const p=P[i];let r=[0,0,fw,fh];
  if(P.length>1){const b=p.cell.getBoundingClientRect();r=[b.left-fb.left,fh-(b.bottom-fb.top),b.width,b.height]}
  R.setViewport(...r);R.setScissor(...r);cam.aspect=r[2]/r[3];cam.fov=cam.aspect<1?75:60;cam.updateProjectionMatrix();
  const cz=p?p.camZ:0,cx=P.length>1?p.ck.position.x:0;
  const ly=P.length>1?2.6:(fw<fh&&fw<=600?-2.5:1.8);cam.position.set(cx,4.2,cz+8);cam.lookAt(cx,ly,cz-14);R.render(S,cam)}}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&P.length&&!done&&!paused)bP.onclick()});
menu();loop();
</script></body></html>
